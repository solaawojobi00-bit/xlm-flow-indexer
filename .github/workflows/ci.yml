name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch. Without this, pushing twice to a PR
# leaves the first run burning minutes on a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job names below become required status checks when branch protection lands
  # (BACKLOG.md item 20). Renaming one silently detaches it from branch protection
  # and the check stops being enforced, so treat these names as an interface.
  #
  # Every job reads the Node version from .nvmrc via node-version-file, so the pin
  # lives in exactly one place and local development and CI cannot drift apart.
  # An exact patch is deliberate: each Node patch ships one fixed npm version, so
  # pinning Node pins npm too, with no packageManager field or corepack needed.
  # A floating '24' does not -- the first CI run resolved to 24.20.0 (npm 11.19.0)
  # while local development was on 24.14.0 (npm 11.9.0), a gap wide enough that
  # npm 11.19 has an install-scripts approval command 11.9 lacks entirely.

  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Recorded so a future drift is visible in the log rather than inferred from
      # a warning, and so the install-script approval follow-up has a known target.
      - name: Report resolved toolchain
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo "- node \`$(node --version)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm \`$(npm --version)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: .nvmrc matches the Node actually in use
        run: |
          pinned="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          echo "pinned=$pinned actual=$actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::.nvmrc pins $pinned but the runner resolved $actual."
            exit 1
          fi

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Migrations apply cleanly from empty
        run: npm run migrate -- ci-check.db

      - name: Re-running migrations is a no-op
        run: |
          output=$(npm run migrate --silent -- ci-check.db)
          echo "$output"
          if [ "$output" != "No pending migrations." ]; then
            echo "::error::Second migrate run was not a no-op. Migrations must be idempotent."
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # The Postgres half of the dual-dialect schema (issue #48).
  #
  # Kept as its own job rather than folded into `test`, because it is the only
  # job needing a service container and because a Postgres failure should be
  # distinguishable at a glance from a SQLite one. The suites in
  # test/postgres.test.ts skip themselves when DATABASE_URL is unset, so the
  # `test` job above stays engine-independent and contributors without a local
  # Postgres are unaffected.
  #
  # NOTE: this job name is not yet a required status check. Branch protection
  # (#54) requires the six names that existed when it was configured; adding
  # this one to the required set is a repo Settings change.
  postgres:
    name: postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to a major. The schema translation targets standard NUMERIC and
        # TIMESTAMPTZ behaviour, so a minor bump is not expected to matter, but
        # a silently floating major would make this job's result unreproducible.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xlm_flow_indexer
        ports:
          - 5432:5432
        # Without the health check the steps below race the server's startup and
        # fail on connection refused rather than on anything real.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/xlm_flow_indexer

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Migrations apply cleanly from empty
        run: npm run migrate -- --postgres "$DATABASE_URL"

      - name: Re-running migrations is a no-op
        run: |
          output=$(npm run migrate --silent -- --postgres "$DATABASE_URL")
          echo "$output"
          if [ "$output" != "No pending migrations." ]; then
            echo "::error::Second migrate run was not a no-op. Migrations must be idempotent."
            exit 1
          fi

      # Asserts the translated types and the issue #1 constraints against the
      # real engine, which is the part that cannot be checked without a server.
      - name: Postgres schema and constraint suite
        run: node --test test/postgres.test.ts
