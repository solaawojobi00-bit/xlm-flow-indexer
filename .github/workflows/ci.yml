name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch. Without this, pushing twice to a PR
# leaves the first run burning minutes on a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kept in step with the "engines" field in package.json. Both must move together.
  NODE_VERSION: '24'

jobs:
  # Job names below become required status checks when branch protection lands
  # (BACKLOG.md item 20). Renaming one silently detaches it from branch protection
  # and the check stops being enforced, so treat these names as an interface.

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Migrations apply cleanly from empty
        run: npm run migrate -- ci-check.db

      - name: Re-running migrations is a no-op
        run: |
          output=$(npm run migrate --silent -- ci-check.db)
          echo "$output"
          if [ "$output" != "No pending migrations." ]; then
            echo "::error::Second migrate run was not a no-op. Migrations must be idempotent."
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
