name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays at 07:00 UTC. The weekly run is not redundant with the PR and push
    # triggers: CodeQL ships new queries between releases, so a scheduled scan
    # re-analyses unchanged code against rules that did not exist when it merged.
    # 07:00 keeps it clear of the 06:00 live-testnet job.
    - cron: '0 7 * * 1'

# Superseded runs on the same branch are wasted minutes, same reasoning as ci.yml.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest

    permissions:
      # Uploading the SARIF results to the repository's code scanning alerts.
      security-events: write
      contents: read
      # CodeQL reads workflow definitions to report the analysis configuration.
      actions: read

    steps:
      - uses: actions/checkout@v7

      # javascript-typescript covers both languages in one pack and needs no
      # build: the extractor reads sources directly, which suits a project that
      # runs TypeScript through Node's type stripping rather than compiling first.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      # No queries: block, so this is the default suite (security-extended is a
      # deliberate follow-up, not a default). dist/ is gitignored, so the
      # extractor sees each source file once rather than source plus build output.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
